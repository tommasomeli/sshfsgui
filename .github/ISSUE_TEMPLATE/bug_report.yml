name: Bug Report
description: Report a crash, mount failure, or unexpected behaviour
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report.
        Include your app and macOS versions and the steps to reproduce.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Server configuration (without secrets), actions taken, and what happened.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: App version
      description: SSHFS GUI → About, or the release tag you installed.
      placeholder: e.g. 1.2.0
    validations:
      required: true
  - type: input
    id: macos_version
    attributes:
      label: macOS version
      placeholder: e.g. 15.4
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or error messages
      description: Terminal output from sshfs, or messages shown in the app.
      render: shell
    validations:
      required: false
