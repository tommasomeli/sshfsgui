name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        if: ${{ hashFiles('pnpm-lock.yaml') == '' }}
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-node@v6
        if: ${{ hashFiles('pnpm-lock.yaml') != '' }}
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install
          fi

      - run: pnpm run lint
      - run: pnpm test
      - name: Build frontend
        run: pnpm run build:frontend

  rust-check:
    name: cargo check (src-tauri)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        if: ${{ hashFiles('pnpm-lock.yaml') == '' }}
        with:
          node-version: '22'
      - uses: actions/setup-node@v6
        if: ${{ hashFiles('pnpm-lock.yaml') != '' }}
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install
          fi

      # Tauri embeds the frontend build via generate_context!() at compile
      # time, so the frontend must exist before cargo can check src-tauri.
      - name: Build frontend
        run: pnpm run build:frontend

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

  coverage:
    name: coverage (node 22)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        if: ${{ hashFiles('pnpm-lock.yaml') == '' }}
        with:
          node-version: '22'
      - uses: actions/setup-node@v6
        if: ${{ hashFiles('pnpm-lock.yaml') != '' }}
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install
          fi

      - run: pnpm run test:coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/

  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [test, rust-check, coverage]
    steps:
      - run: echo "All CI jobs passed"
